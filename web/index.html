<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toroidal Smith Chart Engine</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Three.js CDN for 3D Toroidal Manifold Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui-container">
        <h1>Toroidal Smith Chart</h1>
        <p>Dynamic Vacuum-Density Plenum Mapping</p>
        <div class="control-group">
            <label for="densitySlider">Vacuum Density (&rho;): <span id="densityVal">1.0</span></label>
            <input type="range" id="densitySlider" min="0.1" max="3.0" step="0.1" value="1.0">
        </div>
        <div class="control-group">
            <label for="freqSlider">Phase Modulation (<i>t</i>): <span id="freqVal">0.0</span></label>
            <input type="range" id="freqSlider" min="0.0" max="6.28" step="0.05" value="0.0">
        </div>
    </div>
    <div id="canvas-container"></div>

    <script src="renderer.js"></script>
</body>
</html>
